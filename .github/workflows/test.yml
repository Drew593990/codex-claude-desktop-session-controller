name: Windows checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '${{ matrix.python }}'
      - uses: actions/setup-node@v5
        with:
          node-version: '${{ matrix.node }}'
      - run: python -m pip install -r requirements.txt
      - run: python -B -m unittest -v test_bridge
      - run: python -B tests/test_install.py -v
      - run: python -B tests/test_public_scan.py -v
      - run: node --test native-controller.test.cjs
      - run: python scripts/check_public.py
